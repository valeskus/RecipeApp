name: android-release
on:
  pull_request:
    branches:
      - 'develop'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: zulu

      - name: Setup Android SDK
        uses: amyu/setup-android@v4

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            gradle-

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('yarn.lock') }}
          restore-keys: node_modules

      - name: Install bundle dependencies
        run: bundle exec fastlane install_plugins

      - name: Build release
        run: bundle exec fastlane android build_release
        env:
          RELEASE_ANDROID_PASSWORD: ${{ secrets.RELEASE_ANDROID_PASSWORD }}
          ACCESS_TOKEN: ${{ secrets.INTERNAL_STORE_ACCESS_TOKEN }}
          SENTRY_KEY: ${{ secrets.SENTRY_KEY  }}
    
      - name: Deliver Android release artifacts to play store
        run: bundle exec fastlane android upload_play_store
        env:
          PLAY_STORE_AUTH_JSON: ${{ secrets.PLAY_STORE_AUTH_JSON }}